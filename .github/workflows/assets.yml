name: Update assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats
          path: assets/stats.svg

  top-langs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent
          path: assets/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: top-langs
          path: assets/langs.svg

  pin-wixibot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate pin card (WixiBot)
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=WixiBot&description_lines_count=1&theme=transparent
          path: assets/repos/WixiBot.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-wixibot
          path: assets/repos/WixiBot.svg

  pin-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate pin card (Server)
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Server&description_lines_count=1&theme=transparent
          path: assets/repos/Server.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-server
          path: assets/repos/Server.svg

  pin-website:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate pin card (Website)
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Website&description_lines_count=1&theme=transparent
          path: assets/repos/Website.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-website
          path: assets/repos/Website.svg

  pin-tipe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate pin card (TIPE)
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=TIPE&description_lines_count=1&theme=transparent
          path: assets/repos/TIPE.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-tipe
          path: assets/repos/TIPE.svg
          
  pin-webhook-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate pin card (Webhook Engine)
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Webhook-Engine&description_lines_count=1&theme=transparent
          path: assets/repos/Webhook-Engine.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-webhook-engine
          path: assets/repos/Webhook-Engine.svg

  pin-atoll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate pin card (Atoll)
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: pin
          options: username=Ebullioscopic&show_owner=true&repo=Atoll&description_lines_count=1&theme=transparent
          path: assets/repos/Atoll.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-atoll
          path: assets/repos/Atoll.svg

  wakatime:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate WakaTime card
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: wakatime
          options: username=${{ github.repository_owner }}&langs_count=6&layout=compact&theme=transparent
          path: assets/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakatime
          path: assets/wakatime.svg

  commit:
    runs-on: ubuntu-latest
    needs: [stats, top-langs, pin-wixibot, pin-server, pin-website, pin-tipe, pin-atoll, pin-webhook-engine, wakatime]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to correct locations
        run: |
          mkdir -p assets/repos
          cp artifacts/stats/stats.svg assets/stats.svg
          cp artifacts/top-langs/langs.svg assets/langs.svg
          cp artifacts/pin-wixibot/WixiBot.svg assets/repos/WixiBot.svg
          cp artifacts/pin-server/Server.svg assets/repos/Server.svg
          cp artifacts/pin-website/Website.svg assets/repos/Website.svg
          cp artifacts/pin-tipe/TIPE.svg assets/repos/TIPE.svg
          cp artifacts/pin-webhook-engine/Webhook-Engine.svg assets/repos/Webhook-Engine.svg
          cp artifacts/pin-atoll/Atoll.svg assets/repos/Atoll.svg
          cp artifacts/wakatime/wakatime.svg assets/wakatime.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Update README cards" || exit 0
          git push
